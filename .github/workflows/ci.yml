# CI for Toolwrit.
#
# Layout: the repository root holds `js/` (TypeScript) and `python/` (Python)
# as siblings. That is deliberate -- the two implementations share a hash chain,
# so they are tested and released together, never apart.
#
# The cross-language job is the one that matters most. Nothing but an automated
# check keeps the two implementations from drifting: a field added to an audit
# entry on one side and not the other breaks compatibility silently, both suites
# still pass, and only a log written by one and read by the other reveals it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Install the package rather than leaning on the working directory:
      # the sources live in `src/`, so a bare `pytest` here cannot import
      # `toolwrit` at all. Installing it also means the suite exercises the
      # same import path a user gets from `pip install toolwrit`.
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  # A package that installs but cannot be imported is a broken release, and the
  # test suite never touches the published entry points -- it imports from src.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: js
      - name: pack, install, and import what consumers will get
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" --silent
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install --silent ./toolwrit-*.tgz
          ./node_modules/.bin/toolwrit --version
          node --input-type=module -e "
            import { Toolwrit, parsePolicy, verifyChain, summarize } from 'toolwrit';
            import { wrapTool } from 'toolwrit/sdk';
            import { createMcpProxy } from 'toolwrit/mcp';
            const policy = parsePolicy('version: \"1\"\ndefault: deny\nrules: []\n');
            const toolwrit = new Toolwrit({ policy });
            if (toolwrit.check('anything').effect !== 'deny') throw new Error('deny-by-default broken');
            if (!verifyChain(toolwrit.entries()).ok) throw new Error('chain broken');
            if (summarize(toolwrit.entries()).entryCount !== 0) throw new Error('receipt broken');
            if (typeof wrapTool !== 'function') throw new Error('sdk subpath export broken');
            if (typeof createMcpProxy !== 'function') throw new Error('mcp subpath export broken');
            console.log('published entry points OK');
          "
        working-directory: js

  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
        working-directory: js
      - run: pip install pyyaml

      - name: a chain written by either implementation verifies with the other
        run: |
          set -euo pipefail
          root="$PWD"
          work="$(mktemp -d)"
          cd "$work"

          cat > p.yaml <<'POLICY'
          version: "1"
          default: deny
          budget: { calls: 50, bytes: 4000 }
          plan: { purpose: "ci parity", approvedBy: ci }
          rules:
            - id: read
              tools: ["fs.read"]
              effect: allow
              when: { path: { startsWith: ["/data/"] } }
          POLICY

          export PYTHONPATH="$root/python/src"

          python - <<'PY'
          from toolwrit import Toolwrit, ToolwritDenied, load_policy_file
          clock = [1789000000000]
          def now():
              clock[0] += 1000
              return clock[0]
          toolwrit = Toolwrit(policy=load_policy_file("p.yaml"), run="parity",
                                audit_file="py.jsonl", now=now)
          for path in ["/data/a", "/etc/passwd", "/data/b"]:
              try:
                  toolwrit.guard("fs.read", {"path": path}, lambda: "contents")
              except ToolwritDenied:
                  pass
          toolwrit.meter(1000, 500, {"input": 0.003, "output": 0.015})
          print("python head:", toolwrit.head())
          PY

          node --input-type=module -e "
            const { Toolwrit, ToolwritDenied, loadPolicyFile } = await import('$root/js/dist/index.js');
            let t = 1789000000000; const now = () => (t += 1000);
            const toolwrit = new Toolwrit({ policy: loadPolicyFile('p.yaml'), run: 'parity', auditFile: 'ts.jsonl', now });
            for (const path of ['/data/a', '/etc/passwd', '/data/b']) {
              try { await toolwrit.guard('fs.read', { path }, () => 'contents'); }
              catch (e) { if (!(e instanceof ToolwritDenied)) throw e; }
            }
            toolwrit.meter(1000, 500, { input: 0.003, output: 0.015 });
            console.log('typescript head:', toolwrit.head());
          "

          node "$root/js/dist/cli.js" verify py.jsonl
          python -m toolwrit.cli verify ts.jsonl

          # Equal hashes, not merely two logs that each verify on their own.
          hashes() {
            node -e "
              const lines = require('node:fs').readFileSync('$1', 'utf8').trim().split('\n');
              console.log(lines.map((l) => JSON.parse(l).hash).join('\n'));
            "
          }
          diff <(hashes py.jsonl) <(hashes ts.jsonl)
          echo "entry hashes are identical across implementations"
