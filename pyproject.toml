[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortleash"
version = "0.1.0"
description = "A deterministic leash for AI agents. Allowlist the tools, cap the budget, prove what happened."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "ai", "agent", "guardrails", "mcp", "tool-calling",
    "policy", "audit", "llm", "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/emektor/shortleash"
Repository = "https://github.com/emektor/shortleash"
Issues = "https://github.com/emektor/shortleash/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
leash = "leash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
